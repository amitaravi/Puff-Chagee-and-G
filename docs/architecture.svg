<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Arbitra multi-agent tribunal architecture</title>
  <desc id="desc">A dispute moves through docket, discovery, fast paths, parallel advocates, provisional judgment, rebuttal, final judgment, and a confidence gate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718197"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1400" height="820" fill="#f6f2e9"/>
  <text x="70" y="70" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#10233f">Arbitra tribunal architecture</text>
  <text x="70" y="105" font-family="Arial,sans-serif" font-size="17" fill="#66758a">Identical discovery. Opposed advocates. Explainable judgment. Principled human review.</text>
  <g fill="none" stroke="#718197" stroke-width="4" marker-end="url(#arrow)">
    <path d="M220 210H300"/><path d="M480 210H560"/>
    <path d="M650 265V330H420"/><path d="M650 265V330H880"/>
    <path d="M420 435V500H650"/><path d="M880 435V500H650"/>
    <path d="M760 550H845"/><path d="M1035 550H1120"/>
    <path d="M1210 605V690H1010"/><path d="M1210 605V690H1275"/>
    <path d="M1015 355V480H910"/>
  </g>
  <g filter="url(#shadow)" font-family="Arial,sans-serif" text-anchor="middle">
    <g><rect x="70" y="155" width="150" height="110" rx="16" fill="#10233f"/><text x="145" y="203" fill="white" font-size="18" font-weight="700">DOCKET</text><text x="145" y="230" fill="#c7d3e0" font-size="14">case intake</text></g>
    <g><rect x="300" y="155" width="180" height="110" rx="16" fill="white" stroke="#7891ad" stroke-width="3"/><text x="390" y="203" fill="#10233f" font-size="18" font-weight="700">DISCOVERY</text><text x="390" y="230" fill="#66758a" font-size="14">same redacted record</text></g>
    <g><rect x="560" y="155" width="180" height="110" rx="16" fill="#fff7e5" stroke="#d6a94b" stroke-width="3"/><text x="650" y="200" fill="#755012" font-size="18" font-weight="700">FAST PATHS</text><text x="650" y="228" fill="#8f6b2d" font-size="14">motions · settlement</text></g>
    <g><rect x="310" y="330" width="220" height="105" rx="16" fill="#eaf1ff" stroke="#2d63d5" stroke-width="3"/><text x="420" y="377" fill="#174eae" font-size="18" font-weight="700">RIDER ADVOCATE</text><text x="420" y="404" fill="#58749a" font-size="14">claims · citations · concession</text></g>
    <g><rect x="770" y="330" width="220" height="105" rx="16" fill="#fff3e4" stroke="#d58a2c" stroke-width="3"/><text x="880" y="377" fill="#98570a" font-size="18" font-weight="700">DRIVER ADVOCATE</text><text x="880" y="404" fill="#896f52" font-size="14">claims · citations · concession</text></g>
    <g><rect x="540" y="500" width="220" height="100" rx="50" fill="#10233f"/><text x="650" y="543" fill="white" font-size="18" font-weight="700">PROVISIONAL JUDGE</text><text x="650" y="570" fill="#c7d3e0" font-size="14">ruling before reply</text></g>
    <g><rect x="845" y="500" width="190" height="100" rx="16" fill="white" stroke="#7891ad" stroke-width="3"/><text x="940" y="543" fill="#10233f" font-size="18" font-weight="700">REBUTTAL</text><text x="940" y="570" fill="#66758a" font-size="14">right of reply</text></g>
    <g><rect x="935" y="260" width="220" height="95" rx="16" fill="#f4ebff" stroke="#8860b7" stroke-width="3"/><text x="1045" y="302" fill="#684092" font-size="18" font-weight="700">JUDGE-ONLY CONTEXT</text><text x="1045" y="329" fill="#7b6790" font-size="14">precedent · fraud signals</text></g>
    <g><rect x="1120" y="500" width="180" height="105" rx="16" fill="#10233f"/><text x="1210" y="546" fill="white" font-size="18" font-weight="700">FINAL JUDGE</text><text x="1210" y="573" fill="#c7d3e0" font-size="14">facts · law · remedy</text></g>
    <g><rect x="920" y="690" width="180" height="90" rx="16" fill="#edf8f3" stroke="#248466" stroke-width="3"/><text x="1010" y="730" fill="#17654e" font-size="18" font-weight="700">FINAL JUDGMENT</text><text x="1010" y="755" fill="#4d7467" font-size="13">confidence ≥ 0.75</text></g>
    <g><rect x="1190" y="690" width="170" height="90" rx="16" fill="#fff0f0" stroke="#c94b52" stroke-width="3"/><text x="1275" y="724" fill="#a52f38" font-size="17" font-weight="700">HUMAN REVIEW</text><text x="1275" y="750" fill="#8d5b5f" font-size="13">low confidence / critical</text></g>
  </g>
  <text x="70" y="780" font-family="Arial,sans-serif" font-size="14" fill="#66758a">Config A: single agent · Config B: advocates, no debate · Config C: full tribunal shown above</text>
</svg>
